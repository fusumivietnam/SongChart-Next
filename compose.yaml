# Local-only app+database stack. Do not point at a PostgreSQL 17 data volume.
services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-songchart}
      POSTGRES_USER: ${POSTGRES_USER:-songchart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD in untracked .env}
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [songchart]
  app:
    build:
      context: .
      target: development
    working_dir: /var/www/html
    command: ["sh", "-ec", "composer install --prefer-dist --no-interaction --no-progress && CI=true pnpm install --frozen-lockfile && exec php artisan serve --host=0.0.0.0 --port=8000"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-songchart}
      DB_USERNAME: ${POSTGRES_USER:-songchart}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in untracked .env}
      VITE_HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:5173:5173"
    volumes:
      - ./:/var/www/html
      - composer_vendor:/var/www/html/vendor
      - pnpm_node_modules:/var/www/html/node_modules
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 8000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy
    networks: [songchart]
volumes:
  postgres18_data:
  composer_vendor:
  pnpm_node_modules:
networks:
  songchart:
    driver: bridge
