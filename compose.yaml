# Development infrastructure scaffold. Application service is added with official Laravel starter + lockfiles.
# Start with: docker compose up -d db
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-songchart}
      POSTGRES_USER: ${POSTGRES_USER:-songchart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an untracked .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - songchart
volumes:
  postgres_data:
networks:
  songchart:
    driver: bridge
