name: Protected Preview smoke (manual)

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Exact Vercel Preview deployment HTTPS origin (not share URL)"
        required: true
        type: string
      expected_sha:
        description: "Exact Vercel Preview source commit SHA (40 hexadecimal characters)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: protected-preview-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: preview-test
    steps:
      - name: Checkout trusted smoke verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Verify requested revision and required access
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be an exact lowercase 40-character Git commit SHA"
            exit 1
          fi
          if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            echo "::error::The preview-test environment must provide VERCEL_AUTOMATION_BYPASS_SECRET"
            exit 1
          fi
          echo "::add-mask::$VERCEL_AUTOMATION_BYPASS_SECRET"
          if [[ ! "$DEPLOYMENT_URL" =~ ^https://songchart-next-preview-[a-z0-9-]+-fusumivietnam[.]vercel[.]app/?$ ]]; then
            echo "::error::Provide a deployment-specific Vercel Preview origin; custom/production domains are disallowed"
            exit 1
          fi
          echo "Smoke verifier ref: $GITHUB_SHA"
          echo "Deployment source SHA to verify against Vercel control plane: $EXPECTED_SHA"

      - name: Run protected 12-route HTTP smoke
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
        run: |
          set -euo pipefail
          python3 scripts/preview_smoke.py --base-url "$DEPLOYMENT_URL" --bypass-env

      - name: Record limited evidence
        if: success()
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          {
            echo "### Protected Preview HTTP smoke"
            echo
            echo "- Preview deployment source revision (operator-declared; verify in Vercel): \`$EXPECTED_SHA\`"
            echo "- Smoke implementation revision: \`$GITHUB_SHA\`"
            echo "- Twelve HTTP routes: passed"
            echo "- Scope: HTTP status/content type/redirect/noindex checks, not responsive or browser acceptance"
            echo "- Vercel SSO remains enabled; bypass is centrally revocable in Vercel"
          } >> "$GITHUB_STEP_SUMMARY"
