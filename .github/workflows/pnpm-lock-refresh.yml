name: Temporary pnpm lock refresh
on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/pnpm-lock-refresh.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - name: Activate repository pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm --version
      - name: Regenerate lockfile from manifest overrides
        shell: bash
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          grep -q "shell-quote@1.11.0" pnpm-lock.yaml
          grep -q "source-map-js@1.2.2" pnpm-lock.yaml
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pnpm-lock-refresh-${{ env.EVIDENCE_SHA }}
          path: pnpm-lock.yaml
          retention-days: 1
