name: Codespaces contract

on:
  pull_request:
    paths:
      - .devcontainer/**
      - docs/adr/ADR-0007-understand-anything-developer-analysis.md
      - scripts/codespaces_doctor.sh
      - scripts/design_review.sh
      - compose.yaml
      - Dockerfile
      - governance/TECHNOLOGY_REGISTRY.json
      - docs/adr/ADR-0006-codespaces-development-environment.md
      - docs/operations/CODESPACES.md
      - .github/workflows/codespaces-contract.yml
  push:
    branches:
      - main
    paths:
      - .devcontainer/**
      - docs/adr/ADR-0007-understand-anything-developer-analysis.md
      - scripts/codespaces_doctor.sh
      - scripts/design_review.sh
      - compose.yaml
      - Dockerfile
      - governance/TECHNOLOGY_REGISTRY.json
      - docs/adr/ADR-0006-codespaces-development-environment.md
      - docs/operations/CODESPACES.md
      - .github/workflows/codespaces-contract.yml
  workflow_dispatch:

concurrency:
  group: codespaces-contract-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EVIDENCE_SHA }}

      - name: Validate dev container JSON
        shell: bash
        run: |
          set -euo pipefail
          jq -e . .devcontainer/devcontainer.json >/dev/null
          jq -e '.image == "mcr.microsoft.com/devcontainers/base:ubuntu-24.04"' .devcontainer/devcontainer.json >/dev/null
          jq -e '.features["ghcr.io/devcontainers/features/docker-outside-of-docker:1"] != null' .devcontainer/devcontainer.json >/dev/null
          jq -e '.features["ghcr.io/devcontainers/features/github-cli:1"] != null' .devcontainer/devcontainer.json >/dev/null
          jq -e '.features["ghcr.io/devcontainers/features/node:1"].version == "22"' .devcontainer/devcontainer.json >/dev/null
          jq -e '.remoteEnv.LOCAL_WORKSPACE_FOLDER == "${localWorkspaceFolder}"' .devcontainer/devcontainer.json >/dev/null
          jq -e '.forwardPorts | index(5174) != null' .devcontainer/devcontainer.json >/dev/null
          jq -e '.hostRequirements.cpus >= 4 and .hostRequirements.memory == "8gb" and .hostRequirements.storage == "32gb"' .devcontainer/devcontainer.json >/dev/null

      - name: Validate Codespaces Docker bind contract
        shell: bash
        env:
          POSTGRES_PASSWORD: ci-local-only-not-a-secret
        run: |
          set -euo pipefail
          grep -F '${LOCAL_WORKSPACE_FOLDER:-.}:/var/www/html' compose.yaml
          LOCAL_WORKSPACE_FOLDER="$PWD" docker compose config --quiet
          rendered="$(LOCAL_WORKSPACE_FOLDER="$PWD" docker compose config)"
          grep -F "$PWD" <<< "$rendered"
          grep -F 'target: /var/www/html' <<< "$rendered"

      - name: Validate lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n .devcontainer/prebuild.sh
          bash -n .devcontainer/post-create.sh
          bash -n .devcontainer/post-start.sh
          bash -n .devcontainer/install-understand-anything.sh
          bash -n scripts/codespaces_doctor.sh
          bash -n scripts/design_review.sh

      - name: Enforce blocking onCreate dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'for cmd in bash git docker gh node corepack' .devcontainer/prebuild.sh
          ! grep -E '(^|[[:space:]])(python3|python|php|composer|pnpm)([[:space:]]|$)' .devcontainer/prebuild.sh
          ! grep -F 'verify_project_os.py' .devcontainer/prebuild.sh

      - name: Verify referenced scripts exist
        shell: bash
        run: |
          set -euo pipefail
          for path in             .devcontainer/prebuild.sh             .devcontainer/post-create.sh             .devcontainer/post-start.sh             .devcontainer/install-understand-anything.sh             scripts/design_review.sh             scripts/codespaces_doctor.sh
          do
            test -f "$path"
          done

      - name: Verify Understand Anything provenance contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'UA_REPO_URL="https://github.com/Egonex-AI/Understand-Anything.git"' .devcontainer/install-understand-anything.sh
          grep -F 'UA_COMMIT="b05cc3b20990afca537b4fc0a49b4d7fbdc65bb0"' .devcontainer/install-understand-anything.sh
          grep -F 'UA_PNPM_VERSION="10.6.2"' .devcontainer/install-understand-anything.sh
          ! grep -E 'git (clone|checkout|pull).* (main|master)([[:space:]]|$)' .devcontainer/install-understand-anything.sh

      - name: Confirm Codespaces base image exists
        run: docker pull mcr.microsoft.com/devcontainers/base:ubuntu-24.04

      - name: Build authored devcontainer with declared features
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          npx --yes @devcontainers/cli@0.83.3 build \
            --workspace-folder . \
            --config .devcontainer/devcontainer.json \
            --log-level trace \
            --log-format text
