name: Project governance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: project-governance-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-24.04
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EVIDENCE_SHA }}

      - name: Check authored registries and contracts
        run: python3 scripts/verify_project_os.py

      - name: Run governance regression tests
        run: python3 -m unittest discover -s tests/governance -v

      - name: Verify CI workflow ownership
        run: python3 scripts/verify_ci_ownership.py

      - name: Generate read-only status snapshot
        run: |
          python3 scripts/project_status.py --json > project-status.json
          python3 scripts/project_status.py | tee project-status.txt

      - name: Publish governance summary
        shell: bash
        run: |
          {
            echo "### Project governance"
            echo
            echo "- Exact revision: ${EVIDENCE_SHA}"
            echo "- Registry/contract validation: passed"
            echo "- Governance regression suite: passed"
            echo "- CI ownership contract: passed"
            echo
            echo '```text'
            cat project-status.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve read-only status evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: project-governance-${{ env.EVIDENCE_SHA }}
          path: |
            project-status.json
            project-status.txt
          if-no-files-found: error
          retention-days: 14
