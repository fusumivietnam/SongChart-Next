name: Project OS contracts
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: project-os-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 scripts/verify_project_os.py
