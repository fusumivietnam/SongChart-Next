name: VS-04 launch proof verification

on:
  pull_request:
    paths:
      - .env.example
      - .gitignore
      - app/Http/Controllers/HealthController.php
      - app/Http/Controllers/SiteDocumentController.php
      - app/Http/Controllers/SeoController.php
      - resources/js/pages/site/**
      - resources/views/app.blade.php
      - routes/web.php
      - tests/Feature/HealthEndpointTest.php
      - tests/Feature/PublicLaunchSurfacesTest.php
      - tests/governance/test_tracked_secret_scan.py
      - tests/governance/test_vs04_*.py
      - scripts/capture_vs04_launch.mjs
      - scripts/scan_tracked_secrets.py
      - scripts/vs04_*
      - design/**
      - docs/operations/**
      - docs/security/VS04_*.md
      - .github/workflows/foundation-app.yml
      - .github/workflows/vs04-launch-proof.yml
  push:
    branches: [main]
    paths:
      - .env.example
      - .gitignore
      - app/Http/Controllers/HealthController.php
      - app/Http/Controllers/SiteDocumentController.php
      - app/Http/Controllers/SeoController.php
      - resources/js/pages/site/**
      - resources/views/app.blade.php
      - routes/web.php
      - tests/Feature/HealthEndpointTest.php
      - tests/Feature/PublicLaunchSurfacesTest.php
      - tests/governance/test_tracked_secret_scan.py
      - tests/governance/test_vs04_*.py
      - scripts/capture_vs04_launch.mjs
      - scripts/scan_tracked_secrets.py
      - scripts/vs04_*
      - design/**
      - docs/operations/**
      - docs/security/VS04_*.md
      - .github/workflows/foundation-app.yml
      - .github/workflows/vs04-launch-proof.yml
  workflow_dispatch:

concurrency:
  group: vs04-launch-proof-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-vs04:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      POSTGRES_PASSWORD: ci-ephemeral-only

    steps:
      - name: Check out exact evidence revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EVIDENCE_SHA }}

      - name: Verify tracked-secret guard contracts
        shell: bash
        run: |
          python3 -m unittest tests.governance.test_tracked_secret_scan -v
          python3 scripts/scan_tracked_secrets.py
          tracked_env="$(git ls-files '.env' '.env.*' | grep -v '^.env.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "Tracked runtime .env file detected; paths intentionally withheld from summary." >&2
            exit 1
          fi
          grep -F 'Foundation application checks' docs/operations/VS04_RELEASE_CANDIDATE_EVIDENCE.md >/dev/null
          grep -F 'not that SongChart Next is launched or deployed' docs/operations/VS04_RELEASE_CANDIDATE_EVIDENCE.md >/dev/null

      - name: Verify recovery and readiness documentation contracts
        shell: bash
        run: |
          test -s scripts/vs04_recovery_snapshot.php
          grep -F 'disposable CI infrastructure' docs/operations/VS04_RECOVERY_ROLLBACK.md >/dev/null
          grep -F 'not verify production persistence' docs/operations/VS04_RECOVERY_ROLLBACK.md >/dev/null
          grep -F 'dump is temporary runner state only' docs/operations/VS04_RECOVERY_ROLLBACK.md >/dev/null
          python3 -m unittest tests.governance.test_vs04_readiness -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v3.11.1

      - name: Build cached development image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6.18.0
        with:
          context: .
          target: development
          load: true
          tags: songchart-next:development
          cache-from: type=gha,scope=foundation-buildkit

      - name: Prepare disposable Compose environment
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's/REPLACE_WITH_UNIQUE_LOCAL_PASSWORD/ci-ephemeral-only/g' .env
          docker compose config --quiet

      - name: Boot PostgreSQL and application
        shell: bash
        run: |
          if ! docker compose up -d --no-build --wait db app; then
            docker compose ps -a
            docker compose logs --no-color --tail=160 app db
            exit 1
          fi
          docker compose exec -T app php artisan key:generate --force
          docker compose exec -T app php artisan migrate --force

      - name: Verify public launch and health feature contracts
        shell: bash
        run: |
          docker compose exec -T \
            -e APP_ENV=testing \
            -e DB_CONNECTION=pgsql \
            -e DB_HOST=db \
            -e DB_PORT=5432 \
            -e DB_DATABASE=songchart \
            -e DB_USERNAME=songchart \
            -e DB_PASSWORD=ci-ephemeral-only \
            app php artisan test \
              tests/Feature/PublicLaunchSurfacesTest.php \
              tests/Feature/HealthEndpointTest.php

      - name: Verify launch and health source types
        run: docker compose exec -T app php -d memory_limit=512M vendor/bin/phpstan analyse app/Http/Controllers/SiteDocumentController.php app/Http/Controllers/SeoController.php app/Http/Controllers/HealthController.php

      - name: Build production-style frontend assets
        run: docker compose exec -T app pnpm run build

      - name: Verify robots and sitemap over HTTP
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/robots.txt | tee /tmp/robots.txt
          grep -F 'User-agent: *' /tmp/robots.txt
          grep -F '/sitemap.xml' /tmp/robots.txt
          curl --fail --silent --show-error http://127.0.0.1:8000/sitemap.xml | tee /tmp/sitemap.xml
          grep -F '<urlset' /tmp/sitemap.xml
          grep -F '/corrections</loc>' /tmp/sitemap.xml

      - name: Verify application and database health behavior
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/vs04-health
          mkdir -p artifacts/vs04-health

          healthy_code="$(curl --silent --show-error --output artifacts/vs04-health/healthy.json --write-out '%{http_code}' --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/health)"
          test "$healthy_code" = 200
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('artifacts/vs04-health/healthy.json').read_text()) == {'status': 'ok'}
          PY

          docker compose stop db
          unavailable_code="$(curl --silent --show-error --output artifacts/vs04-health/unavailable.json --write-out '%{http_code}' http://127.0.0.1:8000/health)"
          test "$unavailable_code" = 503
          python3 - <<'PY'
          import json
          from pathlib import Path
          body = Path('artifacts/vs04-health/unavailable.json').read_text()
          assert json.loads(body) == {'status': 'unavailable'}
          lowered = body.lower()
          for forbidden in ('postgres', 'pgsql', 'sqlstate', 'exception', 'password', 'host', '5432', 'laravel', 'php'):
              assert forbidden not in lowered
          PY

          docker compose up -d --no-build --wait db
          recovered_code="$(curl --silent --show-error --output artifacts/vs04-health/recovered.json --write-out '%{http_code}' --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/health)"
          test "$recovered_code" = 200
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('artifacts/vs04-health/recovered.json').read_text()) == {'status': 'ok'}
          PY
          printf '%s\n' \
            "source_sha=${EVIDENCE_SHA}" \
            "healthy_http=200" \
            "database_outage_http=503" \
            "database_recovery_http=200" \
            "generic_body_contract=passed" \
            "production_evidence=false" \
            > artifacts/vs04-health/result.txt

      - name: Confirm browser availability
        shell: bash
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
          (google-chrome --version || google-chrome-stable --version || chromium --version || chromium-browser --version)

      - name: Render narrow and wide launch-support evidence
        env:
          VS04_BASE_URL: http://127.0.0.1:8000
          VS04_EVIDENCE_DIR: artifacts/vs04-launch
          VS04_EVIDENCE_SHA: ${{ env.EVIDENCE_SHA }}
        run: node scripts/capture_vs04_launch.mjs

      - name: Rehearse PostgreSQL backup and restore
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/vs04-recovery.dump
          rm -rf artifacts/vs04-recovery
          mkdir -p artifacts/vs04-recovery

          docker compose exec -T app php artisan migrate:fresh --force
          docker compose exec -T app php artisan songchart:fixture:import-artist >/dev/null
          docker compose exec -T app php artisan songchart:fixture:import-release >/dev/null
          docker compose exec -T app php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $recording = App\Models\Recording::query()->where("title", "Signals at Dawn")->firstOrFail();
            app(App\Music\Destinations\StoreDestinationLink::class)->handle(
              "recording",
              $recording->id,
              "Fixture Audio",
              "listen",
              "https://listen.example.test/recordings/signals-at-dawn",
              "vs-04c deterministic recovery fixture",
              "fixture:vs04-recovery",
              ["fixture" => true, "purpose" => "recovery"],
              "verified",
              new DateTimeImmutable("2026-10-11T08:00:00+00:00")
            );
          '

          docker compose exec -T app php scripts/vs04_recovery_snapshot.php > artifacts/vs04-recovery/pre-restore.json
          python3 -m json.tool artifacts/vs04-recovery/pre-restore.json >/dev/null
          grep -q '"destination_links"' artifacts/vs04-recovery/pre-restore.json

          docker compose exec -T db pg_dump -U songchart -d songchart -Fc > /tmp/vs04-recovery.dump
          test -s /tmp/vs04-recovery.dump

          docker compose stop app
          docker compose exec -T db psql -U songchart -d postgres -v ON_ERROR_STOP=1 -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'songchart' AND pid <> pg_backend_pid();" >/dev/null
          docker compose exec -T db dropdb -U songchart --if-exists songchart
          docker compose exec -T db createdb -U songchart songchart
          docker compose exec -T db pg_restore -U songchart -d songchart --no-owner --no-privileges < /tmp/vs04-recovery.dump

          docker compose up -d --no-build --wait app
          docker compose exec -T app php scripts/vs04_recovery_snapshot.php > artifacts/vs04-recovery/post-restore.json
          python3 -m json.tool artifacts/vs04-recovery/post-restore.json >/dev/null
          cmp artifacts/vs04-recovery/pre-restore.json artifacts/vs04-recovery/post-restore.json

          docker compose exec -T app php artisan migrate:status --no-ansi > artifacts/vs04-recovery/migrate-status-restored.txt
          ! grep -E '^\s*Pending\s' artifacts/vs04-recovery/migrate-status-restored.txt
          sha256sum artifacts/vs04-recovery/pre-restore.json | awk '{print $1}' > artifacts/vs04-recovery/snapshot.sha256

      - name: Rehearse one-step migration rollback and forward apply
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/vs04-recovery.dump
          latest_migration="$(docker compose exec -T db psql -U songchart -d songchart -Atc "SELECT migration FROM migrations ORDER BY batch DESC, id DESC LIMIT 1" | tr -d '\r')"
          test -n "$latest_migration"

          docker compose exec -T app php artisan migrate:rollback --step=1 --force --no-ansi > artifacts/vs04-recovery/rollback.txt
          grep -F "$latest_migration" artifacts/vs04-recovery/rollback.txt >/dev/null

          docker compose exec -T app php artisan migrate:status --no-ansi > artifacts/vs04-recovery/migrate-status-rolled-back.txt
          grep -F "$latest_migration" artifacts/vs04-recovery/migrate-status-rolled-back.txt | grep -F 'Pending' >/dev/null

          docker compose exec -T app php artisan migrate --force --no-ansi > artifacts/vs04-recovery/reapply.txt
          grep -F "$latest_migration" artifacts/vs04-recovery/reapply.txt >/dev/null
          docker compose exec -T app php artisan migrate:status --no-ansi > artifacts/vs04-recovery/migrate-status-final.txt
          ! grep -F 'Pending' artifacts/vs04-recovery/migrate-status-final.txt
          test "$(docker compose exec -T db psql -U songchart -d songchart -Atc "SELECT EXISTS (SELECT 1 FROM migrations WHERE migration = '$latest_migration')" | tr -d '\r')" = t
          printf '%s\n' \
            "source_sha=${EVIDENCE_SHA}" \
            "backup_restore=passed" \
            "canonical_snapshot_match=passed" \
            "rollback_step=1" \
            "rollback_migration=${latest_migration}" \
            "forward_reapply=passed" \
            "production_evidence=false" \
            > artifacts/vs04-recovery/result.txt
          rm -f /tmp/vs04-recovery.dump

      - name: Preserve VS-04 launch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vs04-launch-${{ env.EVIDENCE_SHA }}
          path: artifacts/vs04-launch/
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve VS-04 recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vs04-recovery-${{ env.EVIDENCE_SHA }}
          path: artifacts/vs04-recovery/
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve VS-04 health evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vs04-health-${{ env.EVIDENCE_SHA }}
          path: artifacts/vs04-health/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish evidence summary
        if: success()
        shell: bash
        run: |
          {
            echo "### VS-04 launch-proof evidence"
            echo
            echo "- Source revision: \`${EVIDENCE_SHA}\`"
            echo "- High-confidence tracked-secret scan + fixture tests: passed; matched values are never emitted"
            echo "- Runtime .env tracked-file guard: passed"
            echo "- About/Privacy/Terms/Disclaimer/Support/Corrections HTTP contracts: passed"
            echo "- DB-aware health contract: 200 healthy, 503 during actual disposable PostgreSQL outage, 200 after recovery; response body remained generic"
            echo "- Incident/threat/release-readiness contract tests: passed"
            echo "- Deterministic robots.txt and fixed-route sitemap.xml: passed"
            echo "- PHPStan supporting/health controllers and production-style frontend build: passed"
            echo "- Browser evidence: six supporting surfaces at 390x844 and 1440x1024"
            echo "- PostgreSQL logical backup + database recreation + restore: passed"
            echo "- Canonical Artist/Release/Recording/relationship/destination/migration snapshot equality: passed"
            echo "- One-step disposable latest-migration rollback + forward re-apply to fully-up state: passed"
            echo "- Temporary database dump was deleted and is not retained as an artifact"
            echo "- Foundation application checks separately own locked audits, licenses, provenance, production-target validation and SBOMs and must pass on this same exact SHA"
            echo "- G2/G3/G4 tested scope is ready; launch is NOT declared and production-deploy remains candidate until #69 + G5 evidence"
            echo "- Evidence artifacts: \`vs04-launch-${EVIDENCE_SHA}\`, \`vs04-recovery-${EVIDENCE_SHA}\`, \`vs04-health-${EVIDENCE_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show runtime logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 app db || true

      - name: Cleanup disposable runtime
        if: always()
        run: |
          rm -f /tmp/vs04-recovery.dump
          docker compose down --volumes --remove-orphans
