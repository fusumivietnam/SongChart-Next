name: Foundation application checks
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - composer.json
      - composer.lock
      - package.json
      - pnpm-lock.yaml
      - .env.example
      - app/**
      - bootstrap/**
      - config/**
      - database/**
      - resources/**
      - routes/**
      - tests/**
      - .github/workflows/foundation-app.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-ephemeral-only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Confirm reproducible dependencies
        shell: bash
        run: |
          test -s composer.lock
          test -s pnpm-lock.yaml
          docker compose config --quiet
      - name: Prepare disposable CI application environment
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's/REPLACE_WITH_UNIQUE_LOCAL_PASSWORD/ci-ephemeral-only/g' .env
      - name: Build and boot app with PostgreSQL
        shell: bash
        run: |
          if ! docker compose up -d --build --wait db app; then
            docker compose ps -a
            docker compose logs --no-color --tail=160 app db
            exit 1
          fi
      - name: Verify platform and initialize disposable database
        run: |
          docker compose exec -T app composer check-platform-reqs
          docker compose exec -T app php artisan key:generate --force
          docker compose exec -T app php artisan migrate --force
          docker compose exec -T app php artisan db:show --database=pgsql
      - name: Frontend assets, type checks and starter tests
        run: |
          docker compose exec -T app pnpm run build
          docker compose exec -T app pnpm run types:check
          docker compose exec -T -e APP_ENV=testing -e DB_CONNECTION=sqlite -e DB_DATABASE=:memory: app php artisan test
      - name: HTTP smoke of development app (framework only)
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/up > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/ > /dev/null
      - name: Build non-deployable PHP-FPM production target
        run: |
          docker build --target production --tag songchart-next:foundation-ci .
          docker run --rm --entrypoint php songchart-next:foundation-ci -r 'foreach (["pdo_pgsql", "intl", "Zend OPcache"] as $ext) { if (!extension_loaded($ext)) exit(1); }'
          docker run --rm --entrypoint php-fpm songchart-next:foundation-ci -t
          docker run --rm --entrypoint sh songchart-next:foundation-ci -ec '
            ! command -v composer
            ! command -v node
            ! command -v npm
            ! command -v pnpm
            test ! -d /var/www/html/tests
            test ! -d /var/www/html/docs
            test -d /var/www/html/vendor
            test -f /var/www/html/public/build/manifest.json
          '
          dev_image="$(docker compose images -q app)"
          dev_size="$(docker image inspect "$dev_image" --format '{{.Size}}')"
          prod_size="$(docker image inspect songchart-next:foundation-ci --format '{{.Size}}')"
          echo "Development image bytes: $dev_size"
          echo "Production image bytes: $prod_size"
          test "$prod_size" -lt "$dev_size"
          {
            echo "### Docker image footprint"
            echo
            echo "- Development image: $dev_size bytes"
            echo "- Production image: $prod_size bytes"
            echo "- Production/dev ratio: $(( prod_size * 100 / dev_size ))%"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup CI only
        if: always()
        run: docker compose down --volumes --remove-orphans
