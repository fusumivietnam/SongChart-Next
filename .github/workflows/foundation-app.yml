name: Foundation application checks
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - composer.json
      - composer.lock
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .env.example
      - app/**
      - bootstrap/**
      - config/**
      - database/**
      - resources/**
      - routes/**
      - tests/Feature/**
      - tests/Unit/**
      - tests/TestCase.php
      - tests/governance/test_foundation_provenance.py
      - scripts/foundation_provenance.py
      - .github/workflows/foundation-app.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - composer.json
      - composer.lock
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .env.example
      - app/**
      - bootstrap/**
      - config/**
      - database/**
      - resources/**
      - routes/**
      - tests/Feature/**
      - tests/Unit/**
      - tests/TestCase.php
      - tests/governance/test_foundation_provenance.py
      - scripts/foundation_provenance.py
      - .github/workflows/foundation-app.yml
  workflow_dispatch:
concurrency:
  group: foundation-app-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      POSTGRES_PASSWORD: ci-ephemeral-only
    steps:
      - name: Check out exact evidence revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EVIDENCE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Confirm reproducible dependencies
        shell: bash
        run: |
          test -s composer.lock
          test -s pnpm-lock.yaml
          python3 -m unittest tests.governance.test_foundation_provenance -v
          docker compose config --quiet

      - name: Build cached development image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: development
          load: true
          tags: songchart-next:development
          cache-from: type=gha,scope=foundation-buildkit

      - name: Prepare disposable CI application environment
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's/REPLACE_WITH_UNIQUE_LOCAL_PASSWORD/ci-ephemeral-only/g' .env

      - name: Boot cached app with PostgreSQL
        shell: bash
        run: |
          if ! docker compose up -d --no-build --wait db app; then
            docker compose ps -a
            docker compose logs --no-color --tail=160 app db
            exit 1
          fi

      - name: Verify platform and initialize disposable database
        run: |
          docker compose exec -T app composer check-platform-reqs
          docker compose exec -T app php artisan key:generate --force
          docker compose exec -T app php artisan migrate --force
          docker compose exec -T app php artisan db:show --database=pgsql

      - name: Frontend assets, type checks and starter tests
        run: |
          docker compose exec -T app pnpm run build
          docker compose exec -T app pnpm run types:check
          docker compose exec -T -e APP_ENV=testing -e DB_CONNECTION=sqlite -e DB_DATABASE=:memory: app php artisan test

      - name: Generate dependency license inventory
        run: |
          docker compose exec -T app composer licenses --format=json > composer-licenses.json
          docker compose exec -T app pnpm licenses list --prod --json > pnpm-licenses.json
          test -s composer-licenses.json
          test -s pnpm-licenses.json

      - name: Preserve dependency license inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-license-inventory-${{ github.sha }}
          path: |
            composer-licenses.json
            pnpm-licenses.json
          retention-days: 14

      - name: Audit locked Composer dependencies
        run: docker compose exec -T app composer audit --locked --no-interaction

      - name: Audit production pnpm dependencies
        run: docker compose exec -T app pnpm audit --prod --audit-level=high

      - name: Record dependency audit evidence
        run: echo "Locked Composer and production pnpm vulnerability audits passed; license inventories are retained as a review artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve Foundation image provenance
        shell: bash
        run: |
          python3 scripts/foundation_provenance.py --list-images > foundation-images.txt
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path
          refs = [line.strip() for line in Path("foundation-images.txt").read_text().splitlines() if line.strip()]
          digests = {}
          for ref in refs:
              p = subprocess.run(["docker", "buildx", "imagetools", "inspect", ref], text=True, capture_output=True, check=True)
              m = re.search(r"^Digest:\s+(sha256:[0-9a-f]{64})$", p.stdout, re.M)
              if not m:
                  raise SystemExit(f"Could not resolve manifest digest for {ref}")
              digests[ref] = m.group(1)
          Path("foundation-image-digests.json").write_text(json.dumps(digests, indent=2) + "\n")
          PY
          python3 scripts/foundation_provenance.py --image-digests foundation-image-digests.json --require-digests --output foundation-provenance.json > foundation-provenance.txt
          test -s foundation-provenance.json
          cat foundation-provenance.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve Foundation provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-provenance-${{ github.sha }}
          path: |
            foundation-provenance.json
            foundation-provenance.txt
            foundation-image-digests.json
          retention-days: 14

      - name: HTTP smoke of development app (framework only)
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/up > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/ > /dev/null

      - name: Build cached non-deployable production target
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          load: true
          tags: songchart-next:foundation-ci
          cache-from: type=gha,scope=foundation-buildkit
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=foundation-buildkit,mode=max' || '' }}

      - name: Validate non-deployable PHP-FPM production target
        run: |
          docker run --rm --entrypoint php songchart-next:foundation-ci -r 'foreach (["pdo_pgsql", "intl", "Zend OPcache"] as $ext) { if (!extension_loaded($ext)) exit(1); }'
          docker run --rm --entrypoint php-fpm songchart-next:foundation-ci -t
          docker run --rm --entrypoint sh songchart-next:foundation-ci -ec '
            ! command -v composer
            ! command -v node
            ! command -v npm
            ! command -v pnpm
            test ! -d /var/www/html/tests
            test ! -d /var/www/html/docs
            test ! -d /var/www/html/resources/js
            test ! -d /var/www/html/resources/css
            test -d /var/www/html/resources/views
            test -d /var/www/html/vendor
            test -f /var/www/html/public/build/manifest.json
          '
          dev_image="$(docker compose images -q app)"
          dev_size="$(docker image inspect "$dev_image" --format '{{.Size}}')"
          prod_size="$(docker image inspect songchart-next:foundation-ci --format '{{.Size}}')"
          echo "Development image bytes: $dev_size"
          echo "Production image bytes: $prod_size"
          test "$prod_size" -lt "$dev_size"
          {
            echo "### Docker image footprint"
            echo
            echo "- Development image: $dev_size bytes"
            echo "- Production image: $prod_size bytes"
            echo "- Production/dev ratio: $(( prod_size * 100 / dev_size ))%"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate source dependency SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: foundation-source.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Generate production image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: songchart-next:foundation-ci
          format: spdx-json
          output-file: foundation-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Preserve Foundation SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-sbom-${{ github.sha }}
          path: |
            foundation-source.spdx.json
            foundation-image.spdx.json
          retention-days: 14

      - name: Cleanup CI only
        if: always()
        run: docker compose down --volumes --remove-orphans
