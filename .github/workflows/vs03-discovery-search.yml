name: VS-03 discovery journey verification

on:
  pull_request:
    paths:
      - app/Http/Controllers/SearchController.php
      - app/Music/Discovery/**
      - app/Music/Artists/ArtistReadView.php
      - app/Models/**
      - database/**
      - resources/js/pages/search/**
      - resources/js/pages/artists/show.tsx
      - routes/web.php
      - tests/Feature/DiscoverySearchTest.php
      - tests/Feature/ArtistPageTest.php
      - scripts/capture_vs03_search.mjs
      - scripts/vs03_search_benchmark.php
      - .github/workflows/vs03-discovery-search.yml
  push:
    branches: [main]
    paths:
      - app/Http/Controllers/SearchController.php
      - app/Music/Discovery/**
      - app/Music/Artists/ArtistReadView.php
      - app/Models/**
      - database/**
      - resources/js/pages/search/**
      - resources/js/pages/artists/show.tsx
      - routes/web.php
      - tests/Feature/DiscoverySearchTest.php
      - tests/Feature/ArtistPageTest.php
      - scripts/capture_vs03_search.mjs
      - scripts/vs03_search_benchmark.php
      - .github/workflows/vs03-discovery-search.yml
  workflow_dispatch:

concurrency:
  group: vs03-discovery-search-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-vs03:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      POSTGRES_PASSWORD: ci-ephemeral-only

    steps:
      - name: Check out exact evidence revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EVIDENCE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build cached development image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: development
          load: true
          tags: songchart-next:development
          cache-from: |
            type=gha,scope=vs03-buildkit
            type=gha,scope=foundation-buildkit
          cache-to: type=gha,scope=vs03-buildkit,mode=max

      - name: Prepare disposable Compose environment
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's/REPLACE_WITH_UNIQUE_LOCAL_PASSWORD/ci-ephemeral-only/g' .env
          docker compose config --quiet

      - name: Boot PostgreSQL and application
        shell: bash
        run: |
          if ! docker compose up -d --no-build --wait db app; then
            docker compose ps -a
            docker compose logs --no-color --tail=160 app db
            exit 1
          fi
          docker compose exec -T app php artisan key:generate --force
          docker compose exec -T app php artisan migrate --force
          docker compose exec -T app php artisan db:show --database=pgsql

      - name: Run VS-03 PostgreSQL and HTTP contracts
        shell: bash
        run: |
          docker compose exec -T \
            -e APP_ENV=testing \
            -e DB_CONNECTION=pgsql \
            -e DB_HOST=db \
            -e DB_PORT=5432 \
            -e DB_DATABASE=songchart \
            -e DB_USERNAME=songchart \
            -e DB_PASSWORD=ci-ephemeral-only \
            app php artisan test \
              tests/Feature/DiscoverySearchTest.php \
              tests/Feature/ArtistPageTest.php

      - name: Verify VS-03 source types
        run: docker compose exec -T app php -d memory_limit=512M vendor/bin/phpstan analyse app/Music/Discovery app/Music/Artists/ArtistReadView.php app/Http/Controllers/SearchController.php

      - name: Build production-style frontend assets
        run: docker compose exec -T app pnpm run build

      - name: Prepare deterministic discovery journey fixtures
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T app php artisan migrate:fresh --force
          docker compose exec -T app php artisan songchart:fixture:import-artist
          release_output="$(docker compose exec -T app php artisan songchart:fixture:import-release)"
          printf '%s\n' "$release_output"
          release_path="$(printf '%s\n' "$release_output" | tail -n 1 | tr -d '\r')"
          [[ "$release_path" == /releases/* ]]
          artist_path="$(docker compose exec -T app php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $artist = App\Models\Artist::query()->where("name", "Aster Echo")->firstOrFail();
            echo route("artists.show", ["artist" => $artist->id, "slug" => $artist->slug], false);
          ' | tr -d '\r')"
          recording_path="$(docker compose exec -T app php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $recording = App\Models\Recording::query()->where("title", "Signals at Dawn")->firstOrFail();
            echo route("recordings.show", ["recording" => $recording->id, "slug" => $recording->slug], false);
          ' | tr -d '\r')"
          [[ "$artist_path" == /artists/* ]]
          [[ "$recording_path" == /recordings/* ]]
          echo "artist_path=$artist_path" >> "$GITHUB_OUTPUT"
          echo "release_path=$release_path" >> "$GITHUB_OUTPUT"
          echo "recording_path=$recording_path" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused 'http://127.0.0.1:8000/search?q=Aster%20Echo' > /dev/null
          curl --fail --silent --show-error "http://127.0.0.1:8000${artist_path}" > /dev/null
          curl --fail --silent --show-error "http://127.0.0.1:8000${release_path}" > /dev/null
          curl --fail --silent --show-error "http://127.0.0.1:8000${recording_path}" > /dev/null

      - name: Generate bounded PostgreSQL search evidence
        shell: bash
        run: |
          mkdir -p artifacts/vs03-search
          docker compose exec -T app php scripts/vs03_search_benchmark.php > artifacts/vs03-search/benchmark.json
          python3 -m json.tool artifacts/vs03-search/benchmark.json > /dev/null
          grep -q 'not a production-scale benchmark' artifacts/vs03-search/benchmark.json
          grep -q 'pgsql' artifacts/vs03-search/benchmark.json

      - name: Confirm browser availability
        shell: bash
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
          (google-chrome --version || google-chrome-stable --version || chromium --version || chromium-browser --version)

      - name: Render narrow and wide VS-03 discovery journey evidence
        env:
          VS03_BASE_URL: http://127.0.0.1:8000
          VS03_ARTIST_PATH: ${{ steps.fixture.outputs.artist_path }}
          VS03_RELEASE_PATH: ${{ steps.fixture.outputs.release_path }}
          VS03_RECORDING_PATH: ${{ steps.fixture.outputs.recording_path }}
          VS03_EVIDENCE_DIR: artifacts/vs03-search
          VS03_EVIDENCE_SHA: ${{ env.EVIDENCE_SHA }}
        run: node scripts/capture_vs03_search.mjs

      - name: Preserve VS-03 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vs03-discovery-${{ env.EVIDENCE_SHA }}
          path: artifacts/vs03-search/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish evidence summary
        if: success()
        shell: bash
        env:
          ARTIST_PATH: ${{ steps.fixture.outputs.artist_path }}
          RELEASE_PATH: ${{ steps.fixture.outputs.release_path }}
          RECORDING_PATH: ${{ steps.fixture.outputs.recording_path }}
        run: |
          {
            echo "### VS-03 PostgreSQL-first discovery journey evidence"
            echo
            echo "- Source revision: \`${EVIDENCE_SHA}\`"
            echo "- PostgreSQL mixed-entity search and Artist relationship contracts: passed"
            echo "- Exact/prefix/substring deterministic ranking: passed"
            echo "- Query length and mixed-script contracts: passed"
            echo "- Artist -> Release relationship is derived from canonical structured credits"
            echo "- Journey: \`${ARTIST_PATH}\` -> \`${RELEASE_PATH}\` -> \`${RECORDING_PATH}\`"
            echo "- PHPStan discovery/Artist read boundary: passed"
            echo "- Browser renders: search + Artist + Release + Recording + no-results at 390x844 and 1440x1024"
            echo "- Search evidence includes EXPLAIN ANALYZE plus bounded CI latency; it is not production-scale benchmark evidence"
            echo "- Dedicated search-index, provider destinations and production deployment remain outside this workflow"
            echo "- Evidence artifact: \`vs03-discovery-${EVIDENCE_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show runtime logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 app db || true

      - name: Cleanup disposable runtime
        if: always()
        run: docker compose down --volumes --remove-orphans
