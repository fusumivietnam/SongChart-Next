name: Bootstrap official starter lockfiles
# Runs only on the dedicated starter-import branch; locks are generated by real dependency solvers,
# then committed back once. No lockfiles are fabricated or copied from unrelated projects.
on:
  push:
    branches: [foundation/official-starter-import]
    paths:
      - composer.json
      - package.json
      - Dockerfile
      - .github/workflows/bootstrap-lockfiles.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-starter-lockfiles
  cancel-in-progress: false
jobs:
  resolve-lockfiles:
    if: github.repository == 'fusumivietnam/SongChart-Next' && github.ref == 'refs/heads/foundation/official-starter-import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build pinned PHP and JS toolchain
        run: docker build --target php-toolchain -t songchart-toolchain:bootstrap .
      - name: Generate Composer lock from actual PHP 8.4 platform
        run: |
          docker run --rm -v "$PWD:/var/www/html" -w /var/www/html \
            -e COMPOSER_HOME=/tmp/songchart-composer \
            songchart-toolchain:bootstrap composer update --no-scripts --prefer-dist --no-interaction --no-progress
      - name: Generate pnpm lock with real dependency resolution
        run: |
          docker run --rm -v "$PWD:/var/www/html" -w /var/www/html \
            songchart-toolchain:bootstrap pnpm install --lockfile-only --ignore-scripts
      - name: Commit only generated lockfiles to the dedicated branch
        shell: bash
        run: |
          test -s composer.lock && test -s pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- composer.lock pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfiles already up to date"
          else
            git commit -m "build(foundation): lock resolved Composer and pnpm dependencies"
            git push origin HEAD:refs/heads/foundation/official-starter-import
          fi
