name: Preview browser loopback containment (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-browser-loopback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-chromium:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted exact revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install hash-locked disposable browser library
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/preview-browser-venv"
          "$RUNNER_TEMP/preview-browser-venv/bin/python" -m pip install --require-hashes --disable-pip-version-check -r requirements-browser.lock

      - name: Run isolated HTTPS loopback Chrome containment
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome" ]]; then
            echo 'Chrome/Chromium unavailable; fail closed.' >&2
            exit 1
          fi
          # Bound hung Chromium/WebSocket fixture probes independently of the
          # job timeout; preserve only non-sensitive phase checkpoints.
          timeout --signal=TERM --kill-after=5s 90s \
            "$RUNNER_TEMP/preview-browser-venv/bin/python" scripts/verify_preview_browser_containment.py --chrome "$chrome"
          echo 'Loopback-only browser egress exercised; no Preview, secret, screenshot, artifact or acceptance run.' >> "$GITHUB_STEP_SUMMARY"
