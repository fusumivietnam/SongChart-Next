name: Foundation visual render verification

on:
  pull_request:
    paths:
      - Dockerfile
      - composer.json
      - composer.lock
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - bootstrap/**
      - resources/**
      - routes/**
      - design/**
      - scripts/capture_foundation_baselines.mjs
      - scripts/foundation_visual_ci.sh
      - .github/workflows/foundation-visual.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - composer.json
      - composer.lock
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - bootstrap/**
      - resources/**
      - routes/**
      - design/**
      - scripts/capture_foundation_baselines.mjs
      - scripts/foundation_visual_ci.sh
      - .github/workflows/foundation-visual.yml
  workflow_dispatch:

concurrency:
  group: foundation-visual-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FOUNDATION_VISUAL_CONTAINER: foundation-visual
      FOUNDATION_VISUAL_IMAGE: songchart-next:foundation-visual
      FOUNDATION_VISUAL_PORT: "8000"
      FOUNDATION_VISUAL_SKIP_BUILD: "1"

    steps:
      - name: Check out exact evidence revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EVIDENCE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build cached visual image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: frontend-build
          load: true
          tags: songchart-next:foundation-visual
          cache-from: type=gha,scope=foundation-buildkit

      - name: Validate CI visual script
        run: bash -n scripts/foundation_visual_ci.sh

      - name: Confirm browser availability
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
          (google-chrome --version || google-chrome-stable --version || chromium --version || chromium-browser --version)

      - name: Restore deterministic font package cache
        id: font-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/songchart-font-debs
          key: ubuntu-24.04-fonts-noto-cjk-v1

      - name: Download deterministic international font package
        if: steps.font-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/songchart-font-debs"
          sudo apt-get update
          (
            cd "$RUNNER_TEMP/songchart-font-debs"
            apt-get download fonts-noto-cjk
          )
          test -n "$(find "$RUNNER_TEMP/songchart-font-debs" -maxdepth 1 -name 'fonts-noto-cjk_*.deb' -print -quit)"

      - name: Save deterministic font package cache from main
        if: github.event_name == 'push' && steps.font-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/songchart-font-debs
          key: ubuntu-24.04-fonts-noto-cjk-v1

      - name: Install deterministic international font coverage
        shell: bash
        run: |
          set -euo pipefail
          font_deb="$(find "$RUNNER_TEMP/songchart-font-debs" -maxdepth 1 -name 'fonts-noto-cjk_*.deb' -print -quit)"
          test -n "$font_deb"
          sudo apt-get install -y --no-install-recommends "$font_deb"
          fc-match ':lang=ja'
          fc-list ':lang=ja' | grep -q 'Noto'

      - name: Start isolated CI visual server
        run: bash scripts/foundation_visual_ci.sh start

      - name: Verify preview routes return HTML
        shell: bash
        run: |
          set -euo pipefail
          for route in \
            /_design/foundation/artist \
            /_design/foundation/artist-long \
            /_design/foundation/search \
            /_design/foundation/search-empty \
            /_design/foundation/search-error
          do
            curl --fail --silent --show-error "http://127.0.0.1:8000${route}" >/dev/null
          done

      - name: Verify reverse-proxy URL generation
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error \
            -H 'Host: 127.0.0.1:8000' \
            -H 'X-Forwarded-Host: songchart-preview.example.test' \
            -H 'X-Forwarded-Proto: https' \
            -H 'X-Forwarded-Port: 443' \
            http://127.0.0.1:8000/_design/foundation/artist)"

          grep -q 'https://songchart-preview.example.test/build/assets/' <<< "$html"
          ! grep -q 'http://127.0.0.1:8000/build/assets/' <<< "$html"

      - name: Render and verify narrow/wide baselines
        env:
          FOUNDATION_BASE_URL: http://127.0.0.1:8000
          FOUNDATION_EVIDENCE_DIR: artifacts/foundation-baselines
          FOUNDATION_EVIDENCE_SHA: ${{ env.EVIDENCE_SHA }}
        run: node scripts/capture_foundation_baselines.mjs

      - name: Publish evidence summary
        if: success()
        shell: bash
        run: |
          {
            echo "### Foundation visual render evidence"
            echo
            echo "- Source revision: \`${EVIDENCE_SHA}\`"
            echo "- Deterministic surfaces: 5"
            echo "- Viewports per surface: 390x844 and 1440x1024 CSS px"
            echo "- Rendered captures: 10"
            echo "- Reverse-proxy HTTPS/host asset generation: verified"
            echo "- CI runtime: isolated cached BuildKit visual server"
            echo "- Evidence artifact: \`foundation-render-${EVIDENCE_SHA}\`"
            echo "- Artifact retention: 30 days"
            echo "- This verifies deterministic browser rendering only; human Design Authority approval is still required."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve rendered evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-render-${{ env.EVIDENCE_SHA }}
          path: artifacts/foundation-baselines/
          if-no-files-found: warn
          retention-days: 30

      - name: Show server logs on failure
        if: failure()
        run: docker logs "${FOUNDATION_VISUAL_CONTAINER}" || true

      - name: Cleanup CI visual server
        if: always()
        run: bash scripts/foundation_visual_ci.sh stop
