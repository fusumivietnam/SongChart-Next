name: VS-01a Artist verification

on:
  pull_request:
    paths:
      - app/**
      - database/**
      - resources/**
      - routes/**
      - tests/Feature/Artist**
      - tests/Unit/MusicBrainzArtistNormalizerTest.php
      - docs/adr/ADR-0011-vs-01a-artist-identity-and-persistence.md
      - scripts/capture_vs01a_artist.mjs
      - .github/workflows/vs01a-artist.yml
  push:
    branches: [main]
    paths:
      - app/**
      - database/**
      - resources/**
      - routes/**
      - tests/Feature/Artist**
      - tests/Unit/MusicBrainzArtistNormalizerTest.php
      - docs/adr/ADR-0011-vs-01a-artist-identity-and-persistence.md
      - scripts/capture_vs01a_artist.mjs
      - .github/workflows/vs01a-artist.yml
  workflow_dispatch:

concurrency:
  group: vs01a-artist-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-artist-slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      POSTGRES_PASSWORD: ci-ephemeral-only

    steps:
      - name: Check out exact evidence revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EVIDENCE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build cached development image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: development
          load: true
          tags: songchart-next:development
          cache-from: |
            type=gha,scope=vs01a-buildkit
            type=gha,scope=foundation-buildkit
          cache-to: type=gha,scope=vs01a-buildkit,mode=max

      - name: Prepare disposable Compose environment
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's/REPLACE_WITH_UNIQUE_LOCAL_PASSWORD/ci-ephemeral-only/g' .env
          docker compose config --quiet

      - name: Boot PostgreSQL and application
        shell: bash
        run: |
          if ! docker compose up -d --no-build --wait db app; then
            docker compose ps -a
            docker compose logs --no-color --tail=160 app db
            exit 1
          fi
          docker compose exec -T app php artisan key:generate --force
          docker compose exec -T app php artisan migrate --force
          docker compose exec -T app php artisan db:show --database=pgsql

      - name: Run Artist unit and PostgreSQL integration tests
        shell: bash
        run: |
          docker compose exec -T \
            -e APP_ENV=testing \
            -e DB_CONNECTION=pgsql \
            -e DB_HOST=db \
            -e DB_PORT=5432 \
            -e DB_DATABASE=songchart \
            -e DB_USERNAME=songchart \
            -e DB_PASSWORD=ci-ephemeral-only \
            app php artisan test \
              tests/Unit/MusicBrainzArtistNormalizerTest.php \
              tests/Feature/ArtistImportTest.php \
              tests/Feature/ArtistPageTest.php

      - name: Build production-style frontend assets
        run: docker compose exec -T app pnpm run build

      - name: Prepare deterministic canonical Artist
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T app php artisan migrate:fresh --force
          output="$(docker compose exec -T app php artisan songchart:fixture:import-artist)"
          printf '%s\n' "$output"
          artist_path="$(printf '%s\n' "$output" | tail -n 1 | tr -d '\r')"
          [[ "$artist_path" == /artists/* ]]
          echo "artist_path=$artist_path" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused \
            "http://127.0.0.1:8000${artist_path}" > /dev/null

      - name: Verify canonical slug redirect
        shell: bash
        env:
          ARTIST_PATH: ${{ steps.fixture.outputs.artist_path }}
        run: |
          set -euo pipefail
          artist_id="$(cut -d/ -f3 <<< "$ARTIST_PATH")"
          headers="$(curl --silent --show-error --head "http://127.0.0.1:8000/artists/${artist_id}/stale-name")"
          grep -qE '^HTTP/.* 301' <<< "$headers"
          grep -qi "^Location: .*${ARTIST_PATH}" <<< "$headers"

      - name: Confirm browser availability
        shell: bash
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
          (google-chrome --version || google-chrome-stable --version || chromium --version || chromium-browser --version)

      - name: Render narrow and wide public Artist evidence
        env:
          VS01A_BASE_URL: http://127.0.0.1:8000
          VS01A_ARTIST_PATH: ${{ steps.fixture.outputs.artist_path }}
          VS01A_EVIDENCE_DIR: artifacts/vs01a-artist
          VS01A_EVIDENCE_SHA: ${{ env.EVIDENCE_SHA }}
        run: node scripts/capture_vs01a_artist.mjs

      - name: Preserve VS-01a browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vs01a-artist-${{ env.EVIDENCE_SHA }}
          path: artifacts/vs01a-artist/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish evidence summary
        if: success()
        shell: bash
        env:
          ARTIST_PATH: ${{ steps.fixture.outputs.artist_path }}
        run: |
          {
            echo "### VS-01a Artist evidence"
            echo
            echo "- Source revision: \`${EVIDENCE_SHA}\`"
            echo "- PostgreSQL 18.6 migration + integration tests: passed"
            echo "- Deterministic fixture import: passed"
            echo "- Canonical Artist route: \`${ARTIST_PATH}\`"
            echo "- Stale slug -> canonical 301: passed"
            echo "- Browser renders: 390x844 and 1440x1024"
            echo "- Evidence artifact: \`vs01a-artist-${EVIDENCE_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show runtime logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 app db || true

      - name: Cleanup disposable runtime
        if: always()
        run: docker compose down --volumes --remove-orphans
