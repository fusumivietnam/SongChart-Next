name: Archify browser contract

on:
  pull_request:
    paths:
      - '.devcontainer/install-archify.sh'
      - 'scripts/archify_example.sh'
      - 'docs/architecture/examples/archify-public-read.architecture.json'
      - 'docs/adr/ADR-0017-archify-developer-visualization.md'
      - '.github/workflows/archify-browser-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archify-browser-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  browser-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ARCHIFY_UPDATE_CHECK_DISABLED: '1'
    steps:
      - name: Check out exact evidence revision with historical commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (Node.js 24)
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24 for developer-only renderer
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0 (Node.js 24)
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Confirm browser and pinned installer integrity
        shell: bash
        run: |
          set -euo pipefail
          bash -n .devcontainer/install-archify.sh scripts/archify_example.sh
          node --version
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$browser" ]]; then
            echo 'Chrome/Chromium missing on runner; browser-check is mandatory.' >&2
            exit 1
          fi
          "$browser" --version
          echo "ARCHIFY_CHROME=$browser" >> "$GITHUB_ENV"

      - name: Install opt-in pinned Archify in disposable runner
        run: bash .devcontainer/install-archify.sh

      - name: Render, validate and browser-check historical example
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/archify_example.sh
          node - <<'JS'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('.archify/examples/songchart-public-read.finalize.json', 'utf8'));
          if (result.status !== 'pass') throw Error(`finalize: ${result.status}`);
          for (const name of ['validate', 'deliver', 'check', 'browser-check']) {
            const status = result.stages?.[name]?.status;
            if (status !== 'pass') throw Error(`${name}: ${status ?? 'missing'}`);
          }
          console.log('Archify exact-source render and real browser gate passed.');
          JS
