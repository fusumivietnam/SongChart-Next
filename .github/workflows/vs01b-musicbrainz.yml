name: VS-01b MusicBrainz verification

on:
  pull_request:
    paths:
      - app/Music/Providers/**
      - app/Console/Commands/FetchMusicBrainzArtistCommand.php
      - app/Console/Commands/PurgeProviderEvidenceCommand.php
      - app/Providers/AppServiceProvider.php
      - config/services.php
      - database/migrations/**provider_evidence**
      - tests/Feature/MusicBrainzArtistClientTest.php
      - tests/Feature/ProviderRequestGateTest.php
      - docs/providers/MUSICBRAINZ.md
      - governance/TECHNOLOGY_REGISTRY.json
      - .github/workflows/vs01b-musicbrainz.yml
  push:
    branches: [main]
    paths:
      - app/Music/Providers/**
      - app/Console/Commands/FetchMusicBrainzArtistCommand.php
      - app/Console/Commands/PurgeProviderEvidenceCommand.php
      - app/Providers/AppServiceProvider.php
      - config/services.php
      - database/migrations/**provider_evidence**
      - tests/Feature/MusicBrainzArtistClientTest.php
      - tests/Feature/ProviderRequestGateTest.php
      - docs/providers/MUSICBRAINZ.md
      - governance/TECHNOLOGY_REGISTRY.json
      - .github/workflows/vs01b-musicbrainz.yml
  workflow_dispatch:

concurrency:
  group: vs01b-musicbrainz-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-musicbrainz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      POSTGRES_PASSWORD: ci-ephemeral-only
      MUSICBRAINZ_LIVE_ENABLED: "false"

    steps:
      - name: Check out exact evidence revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EVIDENCE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build cached development image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: development
          load: true
          tags: songchart-next:development
          cache-from: |
            type=gha,scope=vs01b-buildkit
            type=gha,scope=foundation-buildkit
          cache-to: type=gha,scope=vs01b-buildkit,mode=max

      - name: Prepare disposable Compose environment
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's/REPLACE_WITH_UNIQUE_LOCAL_PASSWORD/ci-ephemeral-only/g' .env
          docker compose config --quiet

      - name: Boot PostgreSQL and application
        shell: bash
        run: |
          if ! docker compose up -d --no-build --wait db app; then
            docker compose ps -a
            docker compose logs --no-color --tail=160 app db
            exit 1
          fi
          docker compose exec -T app php artisan key:generate --force
          docker compose exec -T app php artisan migrate --force
          docker compose exec -T app php artisan db:show --database=pgsql

      - name: Verify MusicBrainz provider contracts on PostgreSQL
        shell: bash
        run: |
          docker compose exec -T \
            -e APP_ENV=testing \
            -e DB_CONNECTION=pgsql \
            -e DB_HOST=db \
            -e DB_PORT=5432 \
            -e DB_DATABASE=songchart \
            -e DB_USERNAME=songchart \
            -e DB_PASSWORD=ci-ephemeral-only \
            app php artisan test \
              tests/Feature/MusicBrainzArtistClientTest.php \
              tests/Feature/ProviderRequestGateTest.php

      - name: Verify provider source types
        shell: bash
        run: docker compose exec -T app ./vendor/bin/phpstan analyse app/Music/Providers app/Console/Commands/FetchMusicBrainzArtistCommand.php app/Console/Commands/PurgeProviderEvidenceCommand.php --no-progress --memory-limit=512M

      - name: Confirm live network remains disabled in CI
        shell: bash
        run: |
          grep -q '^MUSICBRAINZ_LIVE_ENABLED=false$' .env
          ! grep -R --line-number --fixed-strings 'musicbrainz.org/ws/2/artist' tests/Feature || false

      - name: Publish evidence summary
        if: success()
        shell: bash
        run: |
          {
            echo "### VS-01b MusicBrainz evidence"
            echo
            echo "- Source revision: \`${EVIDENCE_SHA}\`"
            echo "- PostgreSQL provider evidence schema: passed"
            echo "- Success/404/malformed/network/503 contracts: passed"
            echo "- Deployment-wide >=1 second request spacing: passed"
            echo "- 503 bounded backoff + jitter: passed"
            echo "- No canonical Artist mutation on provider failure: passed"
            echo "- Live MusicBrainz network access in CI: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show runtime logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 app db || true

      - name: Cleanup disposable runtime
        if: always()
        run: docker compose down --volumes --remove-orphans
